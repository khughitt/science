# science/src/science_tool/project_artifacts/registry.yaml
# Managed-artifact registry — capabilities matrices.
# See docs/superpowers/specs/2026-04-26-managed-artifacts-long-term-design.md.
artifacts:
  - name: validate.sh
    source: data/validate.sh
    install_target: validate.sh
    description: Structural validation for Science research projects.
    content_type: text
    newline: lf
    mode: '0755'
    consumer: direct_execute
    header_protocol:
      kind: shebang_comment
      comment_prefix: '#'
    extension_protocol:
      kind: python_sidecar
      sidecar_path: validate_local.py
      contract: |
        The packaged validate.sh shim executes `uv run science validate "$@"`.
        The Python validator imports project-local `validate_local.py` when present.
        Project checks register by decorating functions with `@hook(...)`; supported
        hook points are dispatched from the Python runner before, during, and after
        canonical validation.
        See docs/migration/2026-05-19-validate-local-sh-porting-guide.md.
    mutation_policy:
      requires_clean_worktree: true
      commit_default: true
      transaction_kind: temp_commit
