    changelog:
      '2026.04.26': Initial managed artifact (port of scripts/validate.sh + hook infrastructure).
      '2026.04.26.1': 'Audit-surfaced six-fix batch (Plan #7 of conventions audit).'
      '2026.04.26.2': 'Add named hook dispatch points; the sourced_sidecar extension protocol is now functional end-to-end.'
      '2026.04.26.3': 'Replace deprecated `type:` task-field check with `aspects:` per 2026-04-19-entity-aspects-design.md.'
      '2026.04.26.4': 'Keep frontmatter cross-reference warning counts in the parent shell.'
      '2026.04.26.5': 'Resolve frontmatter cross-references against root specs as well as hypothesis specs.'
      '2026.05.03.1': 'Add Section 0 tooling-scaffold check: warns when pyproject.toml is missing, lacks the science dev dep, or .env lacks SCIENCE_TOOL_PATH; runs a `uv run science --help` smoke test when uv is available.'
      '2026.05.03.2': 'Add Section 5a: warn when review_state.review_horizon_days is present and <= 0 (Pydantic rejects at parse time; this surfaces the error earlier in the edit/validate loop).'
      '2026.05.03.3': 'Harden Section 5a awk: anchor parsing to YAML frontmatter delimiters to prevent body-text false positives; extend exit pattern to match tab-indented lines so tab-indented fields are no longer silently skipped.'
      '2026.05.05.1': 'Strict task IDs, local task parent validation, and namespace-first cross-project reference checks.'
      '2026.05.05.2': 'Add --strict and --help flags with proper argument parsing (replaces positional VERBOSE="${1:-}"); introduces strict_warn helper for advisory checks (no callers yet — opt-in in follow-up); adds ../../../science/science search candidate for nested-repo layouts.'
      '2026.05.05.3': 'Ignore task-like substrings inside non-task typed refs during task queue validation; task:* typed refs remain checked.'
      '2026.05.06.1': 'Rename CLI binary from `science-tool` to `science`. Resolver now invokes `uv run --project <path> science`, searches for `./science`, `../science`, etc., and the smoke test runs `uv run science --help`.'
      '2026.05.07.1': 'Recognize science.yaml peers: entries during validate.sh namespace-first reference checks.'
      '2026.05.07.2': 'Update validate.sh unknown namespace guidance from children: to peers:.'
      '2026.05.07.3': 'Remove validate.sh legacy children: namespace discovery.'
      '2026.05.07.4': 'Run semantic peer validation from validate.sh.'
      '2026.05.10.1': 'Add Section 18 prose lints powered by `science prose lint --format json`. Default emits warn for bare-author-year and short-form-ids; info for frontmatter-inline-gap and numeric-anchor (promoted under --strict).'
      '2026.05.10.2': 'Section 6 consolidation: replace bash bibtex citation check with `science refs check --format json` invocation (mirroring Section 18 prose-lint pattern). Renamed "Citation integrity" → "Reference integrity" — now reports per-type counts (citation, doi, pmid, hypothesis, task, link, etc.) rather than just bibtex. Falls back to a minimal bash bibtex check when SCIENCE_TOOL is unavailable.'
      '2026.05.11.1': 'Section 19 (Annotation drift): invokes `science annotate verify --format json --summary-only` and reports broken / degraded / fuzzy / source-missing / parse-error counts. Broken and parse-errors warn unconditionally; the rest promote under --strict (via `strict_warn`).'
      '2026.05.11.2': 'Section 8 markers scan now passes --ignore-lifted to dedupe inline tokens against lifted sidecar rows (P3.2).'
      '2026.05.12.1': 'Add agent-context drift checks: CLAUDE.md must stay minimal, @core/* includes warn, AGENTS.md digest markers are checked, and core/overview.md has a 150-line / 1200-word budget.'
      '2026.05.21.1': 'Replace in-project canonical validate.sh body with packaged shim; project-local checks move to validate_local.py per docs/migration/2026-05-19-validate-local-sh-porting-guide.md.'
