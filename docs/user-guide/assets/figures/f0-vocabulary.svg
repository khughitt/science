<svg class="sci-figure" role="img" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg">
  <title>Entity vocabulary reader's key</title>
  <desc>The shared visual vocabulary for Science figures: color marks an entity's class
  (epistemic indigo, operational cyan, reference stone), shape reinforces its kind family,
  and the label names the exact kind. Derived state is slate with a "derived" badge.
  A relations key shows support, dispute, and plumbing edges.</desc>

  <defs>
    <marker id="arrow-support" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-dispute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-plumbing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- ============ EPISTEMIC (left) ============ -->
  <rect class="sci-epistemic" x="16" y="28" width="14" height="14" rx="2"/>
  <text x="38" y="40" font-size="14" font-weight="700">EPISTEMIC</text>
  <text x="132" y="40" class="muted" font-size="12">belief-bearing &amp; inquiry</text>

  <!-- Row 1 -->
  <!-- question: stadium -->
  <rect class="sci-epistemic" x="39" y="102" width="90" height="36" rx="18"/>
  <text x="84" y="162" text-anchor="middle" font-size="12">question</text>

  <!-- hypothesis: hexagon -->
  <polygon class="sci-epistemic" points="175,120 195,98 245,98 265,120 245,142 195,142"/>
  <text x="220" y="162" text-anchor="middle" font-size="12">hypothesis</text>

  <!-- proposition: heavy-border rounded rect -->
  <rect class="sci-proposition" x="308" y="100" width="96" height="40" rx="8"/>
  <text x="356" y="160" text-anchor="middle" font-size="12"><tspan x="356" dy="0">proposition</tspan><tspan x="356" dy="14">(belief-bearing)</tspan></text>

  <!-- observation: circle -->
  <circle class="sci-epistemic" cx="492" cy="120" r="22"/>
  <text x="492" y="162" text-anchor="middle" font-size="12">observation</text>

  <!-- Row 2 -->
  <!-- evidence-line: parallelogram -->
  <polygon class="sci-epistemic" points="44,250 60,214 129,214 113,250"/>
  <text x="84" y="272" text-anchor="middle" font-size="12"><tspan x="84" dy="0">evidence-line</tspan><tspan x="84" dy="14">+ / −</tspan></text>

  <!-- inquiry / patch: dashed neighborhood container -->
  <rect class="sci-epistemic" x="168" y="210" width="104" height="44" rx="12" stroke-dasharray="6 5"/>
  <text x="220" y="272" text-anchor="middle" font-size="12"><tspan x="220" dy="0">inquiry / patch</tspan><tspan x="220" dy="14">(neighborhood)</tspan></text>

  <!-- report: lined document -->
  <rect class="sci-epistemic" x="318" y="208" width="76" height="48" rx="3"/>
  <rect class="muted" x="330" y="220" width="52" height="3"/>
  <rect class="muted" x="330" y="230" width="52" height="3"/>
  <rect class="muted" x="330" y="240" width="40" height="3"/>
  <text x="356" y="272" text-anchor="middle" font-size="12">report</text>

  <!-- ============ OPERATIONAL (right, top) ============ -->
  <rect class="sci-operational" x="576" y="28" width="14" height="14" rx="2"/>
  <text x="598" y="40" font-size="14" font-weight="700">OPERATIONAL</text>
  <text x="712" y="40" class="muted" font-size="12">analysis substrate</text>

  <!-- dataset: cylinder -->
  <path class="sci-operational" d="M611,96 V124 A26,8 0 0 0 663,124 V96"/>
  <ellipse class="sci-operational" cx="637" cy="96" rx="26" ry="8"/>
  <text x="637" y="152" text-anchor="middle" font-size="12">dataset</text>

  <!-- workflow / run: chevron -->
  <polygon class="sci-operational" points="720,92 758,92 786,110 758,128 720,128 742,110"/>
  <text x="756" y="152" text-anchor="middle" font-size="12">workflow / run</text>

  <!-- source / paper: dog-eared page -->
  <path class="sci-operational" d="M861,86 H897 L909,98 V134 H861 Z"/>
  <polygon class="muted" points="897,86 897,98 909,98"/>
  <text x="885" y="152" text-anchor="middle" font-size="12">source / paper</text>

  <!-- ============ REFERENCE (right, lower) ============ -->
  <rect class="sci-reference" x="576" y="190" width="14" height="14" rx="2"/>
  <text x="598" y="202" font-size="14" font-weight="700">REFERENCE</text>
  <text x="692" y="202" class="muted" font-size="12">controlled vocabulary</text>

  <!-- concept / variable / outcome: notched tag -->
  <polygon class="sci-reference" points="720,232 787,232 800,250 787,268 720,268"/>
  <circle class="muted" cx="731" cy="250" r="4"/>
  <text x="760" y="290" text-anchor="middle" font-size="12">concept / variable / outcome</text>

  <!-- ============ DERIVED STATE (band) ============ -->
  <rect class="sci-derived" x="16" y="312" width="14" height="14" rx="2"/>
  <text x="38" y="324" font-size="14" font-weight="700">DERIVED STATE</text>
  <text x="170" y="324" class="muted" font-size="12">generated — never authored</text>

  <!-- belief: gauge ring -->
  <circle class="sci-derived" cx="150" cy="368" r="24"/>
  <path class="sci-derived" fill="none" stroke-width="4" d="M133,385 A24,24 0 1 1 167,385"/>
  <polygon class="muted" points="150,368 167,357 165,363"/>
  <rect class="sci-badge" x="150" y="332" width="46" height="15" rx="3"/>
  <text class="sci-badge-text" x="173" y="343" text-anchor="middle">derived</text>
  <text x="150" y="406" text-anchor="middle" font-size="12">belief</text>

  <!-- snapshot: stacked rects -->
  <rect class="sci-derived" x="406" y="340" width="48" height="32" rx="3"/>
  <rect class="sci-derived" x="412" y="346" width="48" height="32" rx="3"/>
  <rect class="sci-derived" x="418" y="352" width="48" height="32" rx="3"/>
  <rect class="sci-badge" x="430" y="330" width="46" height="15" rx="3"/>
  <text class="sci-badge-text" x="453" y="341" text-anchor="middle">derived</text>
  <text x="436" y="406" text-anchor="middle" font-size="12">snapshot</text>

  <!-- graph: node-link network inside a faint derived panel -->
  <rect class="sci-derived" x="556" y="340" width="64" height="44" rx="4"/>
  <g class="sci-graph-edge">
    <line x1="566" y1="362" x2="581" y2="349"/>
    <line x1="566" y1="362" x2="584" y2="375"/>
    <line x1="581" y1="349" x2="584" y2="375"/>
    <line x1="581" y1="349" x2="598" y2="357"/>
    <line x1="584" y1="375" x2="595" y2="378"/>
    <line x1="598" y1="357" x2="595" y2="378"/>
    <line x1="598" y1="357" x2="612" y2="368"/>
    <line x1="595" y1="378" x2="612" y2="368"/>
  </g>
  <g class="sci-graph-node">
    <circle cx="566" cy="362" r="3.2"/>
    <circle cx="581" cy="349" r="3.2"/>
    <circle cx="584" cy="375" r="3.2"/>
    <circle cx="598" cy="357" r="3.2"/>
    <circle cx="595" cy="378" r="3.2"/>
    <circle cx="612" cy="368" r="3.2"/>
  </g>
  <rect class="sci-badge" x="565" y="326" width="46" height="15" rx="3"/>
  <text class="sci-badge-text" x="588" y="337" text-anchor="middle">derived</text>
  <text x="588" y="406" text-anchor="middle" font-size="12">graph</text>

  <!-- dashboards / health: bar panel -->
  <rect class="sci-derived" x="700" y="338" width="80" height="46" rx="4"/>
  <rect class="muted" x="712" y="366" width="10" height="12"/>
  <rect class="muted" x="730" y="358" width="10" height="20"/>
  <rect class="muted" x="748" y="350" width="10" height="28"/>
  <rect class="sci-badge" x="736" y="326" width="46" height="15" rx="3"/>
  <text class="sci-badge-text" x="759" y="337" text-anchor="middle">derived</text>
  <text x="740" y="406" text-anchor="middle" font-size="12">dashboards / health</text>

  <!-- ============ RELATIONS (band) ============ -->
  <text x="16" y="446" font-size="14" font-weight="700">RELATIONS</text>

  <line class="sci-edge-support" x1="60" y1="474" x2="150" y2="474" marker-end="url(#arrow-support)"/>
  <text x="162" y="478" font-size="12">+ supports</text>

  <line class="sci-edge-dispute" x1="320" y1="474" x2="410" y2="474" marker-end="url(#arrow-dispute)"/>
  <text x="422" y="478" font-size="12">− disputes</text>

  <line class="sci-edge-plumbing" x1="600" y1="474" x2="690" y2="474" marker-end="url(#arrow-plumbing)"/>
  <text x="702" y="478" font-size="12">plumbing / derived</text>
</svg>
