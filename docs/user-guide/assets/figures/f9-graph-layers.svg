<svg class="sci-figure" role="img" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <title>Named-graph layers within the derived graph</title>
  <desc>The derived knowledge/graph.trig holds several named graphs. A semantic layer holds the
  durable proposition and evidence triples (three propositions, p01 p02 p03). Above it, two
  patch named graphs — an inquiry A and a patch B — are relation-based overlays: their
  sci:inPatch membership edges point down into propositions in the shared semantic layer.
  Proposition p02 belongs to both A and B, showing that membership overlaps without
  duplicating the underlying triples or choosing a primary patch.</desc>

  <defs>
    <marker id="f9-plumb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- ===================== DERIVED CONTAINER: graph.trig ===================== -->
  <rect x="30" y="30" width="840" height="420" rx="14" fill="none" stroke="#64748B" stroke-width="2"/>
  <text x="52" y="60" font-size="15" font-weight="700">knowledge/graph.trig</text>
  <rect class="sci-badge" x="232" y="47" width="46" height="16" rx="3"/>
  <text class="sci-badge-text" x="255" y="59" text-anchor="middle">derived</text>

  <!-- ===================== MEMBERSHIP EDGES (under nodes) ===================== -->
  <!-- inquiry A -> p01, p02 ; patch B -> p02, p03 (sci:inPatch, plumbing dashed) -->
  <line x1="205" y1="176" x2="175" y2="336" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#f9-plumb)"/>
  <line x1="285" y1="176" x2="428" y2="336" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#f9-plumb)"/>
  <line x1="615" y1="176" x2="472" y2="336" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#f9-plumb)"/>
  <line x1="695" y1="176" x2="725" y2="336" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#f9-plumb)"/>
  <text x="450" y="212" text-anchor="middle" class="muted" font-size="12" font-style="italic">sci:inPatch</text>

  <!-- ===================== PATCH / INQUIRY NAMED GRAPHS (overlays) ===================== -->
  <rect class="sci-derived" x="120" y="118" width="180" height="58" rx="8"/>
  <text x="210" y="143" text-anchor="middle" font-size="13">inquiry: A</text>
  <text x="210" y="161" text-anchor="middle" font-size="11" class="muted">patch named graph</text>

  <rect class="sci-derived" x="600" y="118" width="180" height="58" rx="8"/>
  <text x="690" y="143" text-anchor="middle" font-size="13">patch: B</text>
  <text x="690" y="161" text-anchor="middle" font-size="11" class="muted">patch named graph</text>

  <!-- ===================== SEMANTIC LAYER ===================== -->
  <text x="52" y="322" class="muted" font-size="12" font-weight="600">semantic layer &#8212; durable proposition &amp; evidence triples</text>

  <rect class="sci-epistemic" x="95" y="336" width="160" height="58" rx="8"/>
  <text x="175" y="361" text-anchor="middle" font-size="13">proposition</text>
  <text x="175" y="379" text-anchor="middle" font-size="11" class="muted">p01</text>

  <rect class="sci-epistemic" x="370" y="336" width="160" height="58" rx="8"/>
  <text x="450" y="361" text-anchor="middle" font-size="13">proposition</text>
  <text x="450" y="379" text-anchor="middle" font-size="11" class="muted">p02 &#8212; shared</text>

  <rect class="sci-epistemic" x="645" y="336" width="160" height="58" rx="8"/>
  <text x="725" y="361" text-anchor="middle" font-size="13">proposition</text>
  <text x="725" y="379" text-anchor="middle" font-size="11" class="muted">p03</text>
</svg>
